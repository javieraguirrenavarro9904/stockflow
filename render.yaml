services:
  - type: web
    name: stockflow-api
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build -w @wms/api
    startCommand: npm run start -w @wms/api
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: EMPLOYEE_PASSWORD
        sync: false
